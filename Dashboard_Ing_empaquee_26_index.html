<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard de Empaque · Planta Bebidas MMN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#eef2f4;
    --card:#ffffff;
    --ink:#132630;
    --muted:#6d7d88;
    --line:#e2e8ec;

    --teal:#0ea5a0;
    --teal-l:#e3f7f5;
    --coral:#ff6b4a;
    --coral-l:#ffe9e2;
    --indigo:#5b5fef;
    --indigo-l:#eceafd;

    --good:#22c55e;
    --good-l:#e7f8ee;
    --mid:#f5b942;
    --mid-l:#fef4e0;
    --bad:#ef4444;
    --bad-l:#fdeaea;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    padding:36px 44px 70px;
  }
  .disp{font-family:'Space Grotesk', sans-serif;}

  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-bottom:16px; flex-wrap:wrap; gap:18px;
  }
  .eyebrow{
    font-size:11.5px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--teal); margin-bottom:8px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:32px;
    letter-spacing:-0.01em; color:var(--ink);
  }
  header .sub{color:var(--muted); font-size:14px; margin-top:6px; max-width:520px;}
  .header-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .period{
    display:flex; align-items:center; gap:10px;
    background:var(--ink); color:#fff; border-radius:30px; padding:9px 18px 9px 8px;
  }
  .period .dot{width:26px; height:26px; border-radius:50%; background:var(--coral); display:flex; align-items:center; justify-content:center; font-size:13px;}
  .period span{font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px; letter-spacing:0.02em;}

  .upload-pill{
    position:relative; overflow:hidden; cursor:pointer;
    display:flex; align-items:center; gap:9px;
    background:var(--teal); color:#fff; border:none;
    border-radius:30px; padding:9px 18px 9px 8px;
    font-family:'Inter',sans-serif; font-weight:700; font-size:13.5px;
  }
  .upload-pill .dot{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .upload-pill input{position:absolute; inset:0; opacity:0; cursor:pointer;}

  #statusBar{
    display:none; align-items:center; gap:8px;
    font-size:12.5px; font-weight:600; border-radius:10px;
    padding:10px 16px; margin-bottom:18px;
  }
  #statusBar.ok{display:flex; background:var(--good-l); color:#178a4c;}
  #statusBar.err{display:flex; background:var(--bad-l); color:#c0392b;}

  /* BENTO GRID */
  .bento{
    display:grid;
    grid-template-columns: 0.95fr 0.65fr 0.95fr 0.65fr 0.65fr;
    gap:18px; margin-bottom:18px;
  }
  .card{
    background:var(--card); border-radius:18px; padding:22px 24px;
    box-shadow:0 1px 2px rgba(19,38,48,0.04), 0 8px 20px -12px rgba(19,38,48,0.12);
  }

  .hero{display:flex; align-items:center; gap:18px;}
  .hero svg{flex:none;}
  .hero .htext{display:flex; flex-direction:column; min-width:0;}
  .hero .htext .label{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; font-weight:600;}
  .hero .htext .big{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:36px; margin-top:4px; line-height:1;}
  .hero .htext .note{font-size:12px; color:var(--muted); margin-top:10px; line-height:1.5;}

  .mini-kpi{display:flex; flex-direction:column; justify-content:space-between; height:100%;}
  .mini-kpi .icon{
    width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    margin-bottom:14px;
  }
  .mini-kpi .label{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; font-weight:600;}
  .mini-kpi .val{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:28px; margin-top:4px;}
  .mini-kpi .val small{font-size:14px; color:var(--muted); font-weight:600;}
  .mini-kpi .foot{font-size:11.5px; color:var(--muted); margin-top:10px;}

  /* TREND ROW */
  .trend-row{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:18px;}
  .trend-card .thead{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .trend-card .ttitle{font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px;}
  .trend-card .tsub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .trend-card .ttotal{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:22px; text-align:right;}
  .trend-card .ttotal small{display:block; font-size:10px; color:var(--muted); font-weight:600; text-transform:uppercase;}
  .trend-card canvas{margin-top:10px; max-height:130px;}

  /* SECTION HEADS */
  .section-head{display:flex; justify-content:space-between; align-items:baseline; margin:30px 0 16px; flex-wrap:wrap; gap:10px;}
  .section-head h2{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:21px;}
  .section-head p{font-size:12.5px; color:var(--muted);}
  .legend{display:flex; gap:16px; font-size:12px; color:var(--muted); align-items:center; flex-wrap:wrap;}
  .legend .chip{display:flex; align-items:center; gap:6px;}
  .legend .sw{width:10px; height:10px; border-radius:3px;}

  /* PROJECT CARDS GRID */
  .proj-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;}
  .proj-card{
    background:var(--card); border-radius:16px; padding:18px;
    display:flex; gap:14px; align-items:flex-start;
    box-shadow:0 1px 2px rgba(19,38,48,0.04), 0 8px 18px -14px rgba(19,38,48,0.15);
    border-top:3px solid var(--status-color, var(--mid));
  }
  .proj-card .gauge{flex:none; position:relative; width:64px; height:64px;}
  .proj-card .gauge svg{transform:rotate(-90deg);}
  .proj-card .gauge .gval{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:14.5px;
  }
  .proj-card .info{flex:1; min-width:0;}
  .proj-card .pname{font-weight:700; font-size:13.5px; line-height:1.25; margin-bottom:6px;}
  .proj-card .tags{display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap;}
  .cat-pill{font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; letter-spacing:0.02em;}
  .tipo-pill{font-size:10px; font-weight:600; padding:3px 8px; border-radius:20px; background:var(--indigo-l); color:var(--indigo);}
  .proj-card .comment{font-size:11.5px; color:var(--muted); line-height:1.45;}

  /* BOTTOM ROW */
  .bottom-row{display:grid; grid-template-columns:1fr; gap:18px; margin-top:18px;}
  .stat-card{display:flex; align-items:center; gap:20px;}
  .stat-card .num{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:46px;}
  .stat-card .txt{font-size:12.5px; color:var(--muted); line-height:1.5;}

  footer{margin-top:34px; color:var(--muted); font-size:11.5px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

  .empty-msg{color:var(--muted); font-size:13px; padding:20px 4px;}

  @media (max-width:1300px){
    .bento{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:1100px){
    .trend-row{grid-template-columns:1fr 1fr;}
    .proj-grid{grid-template-columns:1fr 1fr;}
    .bottom-row{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    .proj-grid{grid-template-columns:1fr;}
    .bento{grid-template-columns:1fr;}
    .trend-row{grid-template-columns:1fr;}
    body{padding:24px 18px 50px;}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Dashboard de Empaque</h1>
    <div class="sub">Visitas a planta, especificaciones, aprobaciones en WebCenter y avance de la línea de proyectos activos.</div>
  </div>
  <div class="header-actions">
    <div class="period"><span class="dot">📦</span><span id="periodTag">—</span></div>
    <button class="upload-pill" id="uploadBtn" title="Cargar un nuevo Excel con esta misma estructura">
      <span class="dot">📤</span><span>Cargar Excel</span>
      <input type="file" id="fileInput" accept=".xlsx,.xls">
    </button>
  </div>
</header>

<div id="statusBar"></div>

<!-- BENTO KPI ROW -->
<div class="bento" id="bentoRow"></div>

<!-- TREND ROW -->
<div class="trend-row" id="trendRow"></div>

<!-- AHORRO STAT -->
<div id="ahorroRow" style="margin-bottom:18px;"></div>

<!-- PROJECT CARDS -->
<div class="section-head">
  <div>
    <h2>Avance por proyecto</h2>
    <p id="projCount">— proyectos · ordenados de mayor a menor avance</p>
  </div>
</div>
<div class="proj-grid" id="projGrid"></div>

<!-- BOTTOM ROW -->
<div class="bottom-row" id="bottomRow"></div>

<footer>
  <span id="sourceTag">Fuente: plantilla_dashboard_empaque.xlsx</span>
  <span id="updatedTag">Versión visual · tablero para revisión directiva</span>
</footer>

<script>
Chart.defaults.font.family = "'Inter', sans-serif";
Chart.defaults.color = '#6d7d88';
Chart.defaults.font.size = 11;

/* ============ DEFAULT DATA (plantilla_dashboard_empaque.xlsx) ============ */
const DEFAULT_DATA = {
  mensual: [
    {mes:'Abr',visitas:5,horas:42,espec_suerox:0,espec_mm:2,espec_pc:0,espec_otc:50,web_suerox:18,web_mm:6,web_pc:6,web_otc:6},

    {mes:'Jun',visitas:7,horas:54,espec_suerox:9,espec_mm:5,espec_pc:0,espec_otc:50,web_suerox:26,web_mm:2,web_pc:2,web_otc:2},
    {mes:'Jul',visitas:4,horas:30,espec_suerox:5,espec_mm:2,espec_pc:5,espec_otc:50,web_suerox:55,web_mm:0,web_pc:0,web_otc:0},
    {mes:'Agos',visitas:5,horas:20,espec_suerox:10,espec_mm:15,espec_pc:13,espec_otc:50,web_suerox:20,web_mm:30,web_pc:30,web_otc:300}
  ],
  proyectos: [
    {proyecto:'Suerox Mineral 12 Pack',categoria:'Bebidas',tipo:'Regular',avance:100,claves:'2',comentario:'A solicitud de MKT se corre rediseño de artes: cambio de "IONES" por "ELECTROLITOS".'},
    {proyecto:'Suerox Mineral 24 Pack',categoria:'Bebidas',tipo:'Regular',avance:25,claves:'2',comentario:'A solicitud de MKT se revisa factibilidad de cambiar a formato de 24 piezas por charola y validar cantidad de sabores.'},
    {proyecto:'Suero Oral Repone',categoria:'Bebidas',tipo:'Regular',avance:75,claves:'15',comentario:'Desarrollo sigue en transferencia de sabores. Falta actualizar especificación de botella (pendiente Calidad).'},
    {proyecto:'Suero Oral Repone Clean',categoria:'Bebidas',tipo:'Regular',avance:50,claves:'15',comentario:'Usa los mismos materiales que Suero Oral Repone, con diseños y fórmulas diferentes. Artes en proceso de revisión.'},
    {proyecto:'Suerox Cambio de Imagen',categoria:'Bebidas',tipo:'Regular',avance:50,claves:'60',comentario:'Aplica el rediseño de arte a todas las presentaciones nacionales por cambio de "IONES" a "ELECTROLITOS".'},
    {proyecto:'Suerox 630 ml Nacional en Charola',categoria:'Bebidas',tipo:'Regular',avance:100,claves:'11',comentario:'Pendiente entrega de carpeta para producir en septiembre.'},
    {proyecto:'Suerox 1000 ml Nacional en Charola',categoria:'Bebidas',tipo:'Regular',avance:0,claves:'2',comentario:'Pendiente definición de maquila y compra de charolas. Se cuenta con pre-especificación de charola.'},
    {proyecto:'Pomada de la Campana 19g Tepezcohuite',categoria:'MM',tipo:'Regular',avance:100,claves:'1',comentario:'Pendiente fecha de arranque. Estiba ya probada (mismo corrugado, otro producto).'},
    {proyecto:'Sistema GB (SH1, SH2 y Solución)',categoria:'MM',tipo:'Regular',avance:100,claves:'3',comentario:'Dar seguimiento a tarimas que lleguen a CEDIS.'},
    {proyecto:'Célula Pomada',categoria:'MM',tipo:'Célula',avance:0,claves:'TBD',comentario:'On-hold. Se llegó hasta tener dummy 3D.'},
    {proyecto:'Célula Wildroot',categoria:'MM',tipo:'Célula',avance:0,claves:'TBD',comentario:'On-hold. Se llegó hasta tener dummy 3D.'},
    {proyecto:'Groomen Cambio de Banda Lubricante',categoria:'MM',tipo:'Regular',avance:25,claves:'1',comentario:'En espera de información por parte del maquilador (full service).'},
    {proyecto:'Cambio Resina Marlex Tapa Suerox L-1',categoria:'Bebidas',tipo:'Ahorro',avance:100,claves:'TBD',comentario:'Pruebas satisfactorias, Planta da su VoBo.'},
    {proyecto:'Cambio Resina Marlex Tapa Suerox L-3',categoria:'Bebidas',tipo:'Ahorro',avance:25,claves:'1',comentario:'Pruebas pendientes, fecha por definir.'},
    {proyecto:'Cambio a Termoencogible Delta a JK',categoria:'Bebidas',tipo:'Ahorro',avance:75,claves:'3',comentario:'Falta probar en Línea 3; ya se usa en Línea 1 para 630 ml y Suero Oral Repone.'},
    {proyecto:'Cambio Resina Marlex Tapa Suerox L-8',categoria:'Bebidas',tipo:'Ahorro',avance:25,claves:'1',comentario:'Pruebas pendientes, fecha por definir.'},
    {proyecto:'Cambio a Termoencogible Delta a PRUEBA',categoria:'Bebidas',tipo:'Ahorro',avance:75,claves:'3',comentario:'Falta probar en Línea 3; ya se usa en Línea 1 para 630 ml y Suero Oral Repone.'}
  ],
  ahorro: [
    {proyecto:'Cambio Resina Marlex Tapa Suerox L-1',monto:10000},
    {proyecto:'Cambio Resina Marlex Tapa Suerox L-3',monto:10000},
    {proyecto:'Cambio a Termoencogible Delta a JK',monto:20000}
  ],
  objetivo: [
    {proyecto:'Suerox Mineral 12 Pack',categoria:'Bebidas',avance:100},
    {proyecto:'Suerox Mineral 24 Pack',categoria:'Bebidas',avance:25},
    {proyecto:'Suero Oral Repone',categoria:'Bebidas',avance:75},
    {proyecto:'Suero Oral Repone Clean',categoria:'Bebidas',avance:50}
  ],
  sourceLabel:'plantilla_dashboard_empaque.xlsx'
};

let STATE = { data: DEFAULT_DATA };
let charts = [];
const PALETTE = [
  {base:'#0ea5a0', light:'#e3f7f5'}, // teal
  {base:'#ff6b4a', light:'#ffe9e2'}, // coral
  {base:'#5b5fef', light:'#eceafd'}, // indigo
  {base:'#f5b942', light:'#fef4e0'}, // mid/amber
  {base:'#06b6d4', light:'#e0f7fa'},
  {base:'#a855f7', light:'#f3e8ff'}
];

/* ============ EXCEL PARSING ============ */
function normHeader(h){
  return String(h||'').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[\s_]+/g,'');
}
function findCol(headerMap, candidates){
  for(const c of candidates){
    const key = normHeader(c);
    if(headerMap[key]!==undefined) return headerMap[key];
  }
  return null;
}
function sheetToRows(ws){
  const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
  if(!rows.length) return [];
  const headerMap = {};
  rows[0].forEach((h,i)=>{ headerMap[normHeader(h)] = i; });
  const out = [];
  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    if(row.every(v=>v===null||v==='')) continue;
    out.push({row, headerMap});
  }
  return out;
}
function parseWorkbook(wb){
  const sheetNames = wb.SheetNames;
  const findSheet = (needle)=> sheetNames.find(n=>normHeader(n)===normHeader(needle)) ||
                                sheetNames.find(n=>normHeader(n).includes(normHeader(needle)));
  const result = {mensual:[],proyectos:[],ahorro:[],objetivo:[],sourceLabel:'archivo cargado'};

  const mName = findSheet('Mensual');
  if(mName){
    result.mensual = sheetToRows(wb.Sheets[mName]).map(({row,headerMap})=>{
      const get=(c)=>{const i=findCol(headerMap,c); return i===null?null:row[i];};
      return {
        mes: get(['Mes','Month']),
        visitas: Number(get(['Visitas'])||0),
        horas: Number(get(['Horas'])||0),
        espec_suerox: Number(get(['Espec_Suerox','EspecSuerox'])||0),
        espec_mm: Number(get(['Espec_MM','EspecMM'])||0),
        espec_pc: Number(get(['Espec_PC','EspecPC'])||0),
        espec_otc: Number(get(['Espec_OTC','EspecOTC'])||0),
        web_suerox: Number(get(['Web_Suerox','WebSuerox'])||0),
        web_mm: Number(get(['Web_MM','WebMM'])||0),
        web_pc: Number(get(['Web_PC','WebPC'])||0),
        web_otc: Number(get(['Web_OTC','WebOTC'])||0)
      };
    }).filter(r=>r.mes);
  }

  const pName = findSheet('Proyectos');
  if(pName){
    result.proyectos = sheetToRows(wb.Sheets[pName]).map(({row,headerMap})=>{
      const get=(c)=>{const i=findCol(headerMap,c); return i===null?null:row[i];};
      return {
        proyecto: get(['Proyecto']),
        categoria: get(['Categoria','Categoría'])||'Sin categoría',
        tipo: get(['Tipo'])||'Sin tipo',
        avance: Number(get(['Avance'])||0),
        claves: (get(['Claves']) ?? 'TBD'),
        comentario: get(['Comentario'])||''
      };
    }).filter(r=>r.proyecto);
  }

  const aName = findSheet('Ahorro');
  if(aName){
    result.ahorro = sheetToRows(wb.Sheets[aName]).map(({row,headerMap})=>{
      const get=(c)=>{const i=findCol(headerMap,c); return i===null?null:row[i];};
      let monto = get(['Monto','Ahorro','Importe']);
      if(monto===null){
        for(let i=row.length-1;i>=0;i--){ if(typeof row[i]==='number'){ monto = row[i]; break; } }
      }
      return { proyecto: get(['Proyecto']), monto: Number(monto||0) };
    }).filter(r=>r.proyecto);
  }

  const oName = findSheet('Avance Proyectos objetivo');
  if(oName){
    result.objetivo = sheetToRows(wb.Sheets[oName]).map(({row,headerMap})=>{
      const get=(c)=>{const i=findCol(headerMap,c); return i===null?null:row[i];};
      return {
        proyecto: get(['Proyecto']),
        categoria: get(['Categoria','Categoría'])||'Sin categoría',
        avance: Number(get(['Avance'])||0)
      };
    }).filter(r=>r.proyecto);
  }
  return result;
}

/* ============ HELPERS ============ */
function colorMapFor(values){
  const uniq = [...new Set(values)];
  const map = {};
  uniq.forEach((v,i)=> map[v] = PALETTE[i % PALETTE.length]);
  return map;
}
function statusColor(pct){
  if(pct<=0) return '#ef4444';
  if(pct>=100) return '#22c55e';
  return '#f5b942';
}
function destroyCharts(){ charts.forEach(c=>c.destroy()); charts = []; }
function gradient(ctx, color){
  const g = ctx.createLinearGradient(0,0,0,140);
  g.addColorStop(0, color+'55');
  g.addColorStop(1, color+'02');
  return g;
}

/* ============ RENDER ============ */
function renderAll(){
  const data = STATE.data;
  const proj = data.proyectos;
  const meses = data.mensual.map(m=>m.mes);

  const totalProj = proj.length;
  const avgAvance = totalProj ? Math.round(proj.reduce((s,p)=>s+p.avance,0)/totalProj) : 0;
  const visitasTot = data.mensual.reduce((s,m)=>s+m.visitas,0);
  const horasTot = data.mensual.reduce((s,m)=>s+m.horas,0);
  const especTot = data.mensual.reduce((s,m)=>s+m.espec_suerox+m.espec_mm+m.espec_pc+(m.espec_otc||0),0);
  const webTot = data.mensual.reduce((s,m)=>s+m.web_suerox+m.web_mm+(m.web_pc||0)+(m.web_otc||0),0);
  const clavesNum = proj.reduce((s,p)=> s + (isNaN(Number(p.claves)) ? 0 : Number(p.claves)), 0);
  const clavesTBD = proj.filter(p=> isNaN(Number(p.claves))).length;
  const ahorroTot = data.ahorro.reduce((s,a)=>s+a.monto,0);
  const objetivo = data.objetivo || [];
  const avgObjetivo = objetivo.length ? Math.round(objetivo.reduce((s,p)=>s+p.avance,0)/objetivo.length) : 0;

  const catColors = colorMapFor(proj.map(p=>p.categoria));
  const tipoColors = colorMapFor(proj.map(p=>p.tipo));
  const tipoCounts = {};
  proj.forEach(p=>{ tipoCounts[p.tipo] = (tipoCounts[p.tipo]||0)+1; });
  const catCounts = {};
  proj.forEach(p=>{ catCounts[p.categoria] = (catCounts[p.categoria]||0)+1; });

  document.getElementById('periodTag').textContent = meses.length ? `${meses[0].toUpperCase()} — ${meses[meses.length-1].toUpperCase()}` : 'SIN PERIODO';
  document.getElementById('sourceTag').textContent = `Fuente: ${data.sourceLabel}`;
  document.getElementById('updatedTag').textContent = `Actualizado ${new Date().toLocaleString('es-MX')}`;
  document.getElementById('projCount').textContent = `${totalProj} proyectos · ordenados de mayor a menor avance`;

  /* --- BENTO --- */
  document.getElementById('bentoRow').innerHTML = `
    <div class="card hero">
      <svg width="104" height="104" viewBox="0 0 104 104">
        <circle cx="52" cy="52" r="45" fill="none" stroke="#e2e8ec" stroke-width="12"/>
        <circle id="heroRing" cx="52" cy="52" r="45" fill="none" stroke="#0ea5a0" stroke-width="12"
          stroke-linecap="round" transform="rotate(-90 52 52)"/>
      </svg>
      <div class="htext">
        <div class="label">Avance promedio</div>
        <div class="big">${avgAvance}%</div>
        <div class="note">Sobre ${totalProj} proyecto${totalProj===1?'':'s'} activo${totalProj===1?'':'s'} del portafolio.</div>
      </div>
    </div>
    <div class="card mini-kpi">
      <div class="icon" style="background:var(--indigo-l); color:var(--indigo); font-size:18px;">📋</div>
      <div>
        <div class="label">Proyectos</div>
        <div class="val">${totalProj}</div>
        <div class="foot">${Object.entries(tipoCounts).map(([k,v])=>`${k} ${v}`).join(' · ')}</div>
      </div>
    </div>
    <div class="card hero">
      <svg width="104" height="104" viewBox="0 0 104 104">
        <circle cx="52" cy="52" r="45" fill="none" stroke="#e2e8ec" stroke-width="12"/>
        <circle id="heroRingObjetivo" cx="52" cy="52" r="45" fill="none" stroke="#5b5fef" stroke-width="12"
          stroke-linecap="round" transform="rotate(-90 52 52)"/>
      </svg>
      <div class="htext">
        <div class="label">Avance Proyectos Objetivo</div>
        <div class="big">${avgObjetivo}%</div>
        <div class="note">Sobre ${objetivo.length} proyecto${objetivo.length===1?'':'s'} objetivo${objetivo.length===1?'':'s'} priorizados.</div>
      </div>
    </div>
    <div class="card mini-kpi">
      <div class="icon" style="background:var(--coral-l); color:var(--coral); font-size:18px;">🔑</div>
      <div>
        <div class="label">Claves pipeline</div>
        <div class="val">${clavesNum}</div>
        <div class="foot">${clavesTBD} proyecto${clavesTBD===1?'':'s'} con conteo TBD</div>
      </div>
    </div>
    <div class="card mini-kpi">
      <div class="icon" style="background:var(--teal-l); color:var(--teal); font-size:18px;">🚚</div>
      <div>
        <div class="label">Visitas a planta</div>
        <div class="val">${visitasTot}<small>/ ${horasTot} h</small></div>
        <div class="foot">~${visitasTot? (horasTot/visitasTot).toFixed(1):'0'} h por visita</div>
      </div>
    </div>
  `;

  /* --- TREND ROW --- */
  document.getElementById('trendRow').innerHTML = `
    <div class="card trend-card">
      <div class="thead">
        <div><div class="ttitle">Visitas a planta</div><div class="tsub">visitas y horas por mes</div></div>
        <div class="ttotal">${visitasTot}<small>total periodo</small></div>
      </div>
      <canvas id="chartVisitas"></canvas>
      <div class="legend" style="margin-top:8px; font-size:11px;">
        <div class="chip"><span class="sw" style="background:#5b5fef"></span>Visitas</div>
        <div class="chip"><span class="sw" style="background:#ff6b4a"></span>Horas</div>
      </div>
    </div>
    <div class="card trend-card">
      <div class="thead">
        <div><div class="ttitle">Especificaciones</div><div class="tsub">claves por mes</div></div>
        <div class="ttotal">${especTot}<small>total periodo</small></div>
      </div>
      <canvas id="chartEspec"></canvas>
      <div class="legend" style="margin-top:8px; font-size:11px;">
        <div class="chip"><span class="sw" style="background:#0ea5a0"></span>Bebidas</div>
        <div class="chip"><span class="sw" style="background:#ff6b4a"></span>MM</div>
        <div class="chip"><span class="sw" style="background:#5b5fef"></span>PC</div>
        <div class="chip"><span class="sw" style="background:#f5b942"></span>OTC</div>
      </div>
    </div>
    <div class="card trend-card">
      <div class="thead">
        <div><div class="ttitle">WebCenter</div><div class="tsub">artes aprobadas</div></div>
        <div class="ttotal">${webTot}<small>total periodo</small></div>
      </div>
      <canvas id="chartWeb"></canvas>
      <div class="legend" style="margin-top:8px; font-size:11px;">
        <div class="chip"><span class="sw" style="background:#0ea5a0"></span>Bebidas</div>
        <div class="chip"><span class="sw" style="background:#ff6b4a"></span>MM</div>
        <div class="chip"><span class="sw" style="background:#5b5fef"></span>PC</div>
        <div class="chip"><span class="sw" style="background:#f5b942"></span>OTC</div>
      </div>
    </div>
    <div class="card trend-card tipo-card">
      <div class="thead">
        <div><div class="ttitle">Tipo de proyecto</div><div class="tsub">${totalProj} proyectos</div></div>
      </div>
      <div class="tipo-card-body" style="display:flex; align-items:center; gap:16px; margin-top:6px;">
        <canvas id="chartTipo" style="max-height:96px;max-width:96px;"></canvas>
        <div class="tipo-stats" style="display:flex;flex-direction:column;gap:8px;flex:1;">
          ${Object.entries(tipoCounts).map(([k,v])=>`
            <div class="tipo-stat" style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;">
              <span class="name" style="display:flex;align-items:center;gap:7px;font-weight:600;"><span class="sw" style="width:9px;height:9px;border-radius:3px;background:${tipoColors[k].base}"></span>${k}</span>
              <span class="n" style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;">${v}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>
  `;

  /* --- PROJECT CARDS --- */
  const grid = document.getElementById('projGrid');
  if(!proj.length){
    grid.innerHTML = `<div class="empty-msg">No hay proyectos en este archivo.</div>`;
  } else {
    const sorted = [...proj].sort((a,b)=>b.avance-a.avance);
    const r2 = 26, c2 = 2*Math.PI*r2;
    grid.innerHTML = sorted.map(p=>{
      const sc = statusColor(p.avance);
      const cc = catColors[p.categoria].base;
      const cl = catColors[p.categoria].light;
      const pct = Math.max(0, Math.min(100, p.avance));
      const offset = c2 - (pct/100)*c2;
      return `
        <div class="proj-card" style="--status-color:${sc}">
          <div class="gauge">
            <svg width="64" height="64" viewBox="0 0 64 64">
              <circle cx="32" cy="32" r="${r2}" fill="none" stroke="#eef2f4" stroke-width="7"/>
              <circle cx="32" cy="32" r="${r2}" fill="none" stroke="${sc}" stroke-width="7"
                stroke-linecap="round" stroke-dasharray="${c2}" stroke-dashoffset="${offset}"/>
            </svg>
            <div class="gval">${p.avance}%</div>
          </div>
          <div class="info">
            <div class="pname">${p.proyecto}</div>
            <div class="tags">
              <span class="cat-pill" style="background:${cl};color:${cc}">${p.categoria}</span>
              <span class="tipo-pill">${p.tipo}</span>
            </div>
            <div class="comment">${p.comentario || '—'}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  /* --- AHORRO STAT (above Avance por proyecto) --- */
  document.getElementById('ahorroRow').innerHTML = `
    <div class="card stat-card">
      <div class="num" style="color:var(--teal)">$${ahorroTot.toLocaleString('es-MX')}</div>
      <div class="txt">Ahorro estimado (MXN) generado por ${data.ahorro.length} proyecto${data.ahorro.length===1?'':'s'} de tipo Ahorro en el portafolio.</div>
    </div>
  `;

  /* --- BOTTOM ROW --- */
  document.getElementById('bottomRow').innerHTML = `
    <div class="card stat-card">
      <div class="num" style="color:var(--indigo)">${clavesNum}</div>
      <div class="txt">Claves (SKUs) contempladas en el portafolio de proyectos activos.${clavesTBD? ` No incluye ${clavesTBD} proyecto${clavesTBD===1?'':'s'} cuyo conteo aún está por definir.`:''}</div>
    </div>
  `;

  /* ============ CHARTS ============ */
  destroyCharts();

  const heroRing = document.getElementById('heroRing');
  const heroRingObjetivo = document.getElementById('heroRingObjetivo');
  const R = 45, C = 2*Math.PI*R;
  [heroRing, heroRingObjetivo].forEach(ring=>{
    ring.style.strokeDasharray = C;
    ring.style.strokeDashoffset = C;
  });
  requestAnimationFrame(()=>{
    heroRing.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.3,.8,.3,1)';
    heroRing.style.strokeDashoffset = C - (avgAvance/100)*C;
    heroRingObjetivo.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.3,.8,.3,1)';
    heroRingObjetivo.style.strokeDashoffset = C - (avgObjetivo/100)*C;
  });

  charts.push(new Chart(document.getElementById('chartVisitas'), {
    data:{labels:meses, datasets:[
      {type:'bar', label:'Visitas', data:data.mensual.map(m=>m.visitas), backgroundColor:'#5b5fef', borderRadius:5, maxBarThickness:30, yAxisID:'y', order:2},
      {type:'line', label:'Horas', data:data.mensual.map(m=>m.horas), borderColor:'#ff6b4a', backgroundColor:'#ff6b4a', fill:false, tension:0.4, pointRadius:4, pointBackgroundColor:'#ff6b4a', borderWidth:2.5, yAxisID:'y1', order:1}
    ]},
    options:{
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:(c)=> c.dataset.label==='Horas' ? c.parsed.y+' h' : c.parsed.y+' visitas'}} },
      scales:{
        y:{beginAtZero:true, grid:{color:'#eef2f4'}},
        y1:{beginAtZero:true, position:'right', grid:{display:false}, ticks:{color:'#ff6b4a'}},
        x:{grid:{display:false}}
      }
    }
  }));

  charts.push(new Chart(document.getElementById('chartEspec'), {
    type:'bar',
    data:{labels:meses, datasets:[
      {label:'Suerox', data:data.mensual.map(m=>m.espec_suerox), backgroundColor:'#0ea5a0', borderRadius:4},
      {label:'MM', data:data.mensual.map(m=>m.espec_mm), backgroundColor:'#ff6b4a', borderRadius:4},
      {label:'PC', data:data.mensual.map(m=>m.espec_pc), backgroundColor:'#5b5fef', borderRadius:4},
      {label:'OTC', data:data.mensual.map(m=>m.espec_otc||0), backgroundColor:'#f5b942', borderRadius:4}
    ]},
    options:{plugins:{legend:{display:false}}, scales:{y:{stacked:true, beginAtZero:true, grid:{color:'#eef2f4'}}, x:{stacked:true, grid:{display:false}}}}
  }));

  charts.push(new Chart(document.getElementById('chartWeb'), {
    type:'bar',
    data:{labels:meses, datasets:[
      {label:'Suerox', data:data.mensual.map(m=>m.web_suerox), backgroundColor:'#0ea5a0', borderRadius:4},
      {label:'MM', data:data.mensual.map(m=>m.web_mm), backgroundColor:'#ff6b4a', borderRadius:4},
      {label:'PC', data:data.mensual.map(m=>m.web_pc||0), backgroundColor:'#5b5fef', borderRadius:4},
      {label:'OTC', data:data.mensual.map(m=>m.web_otc||0), backgroundColor:'#f5b942', borderRadius:4}
    ]},
    options:{plugins:{legend:{display:false}}, scales:{y:{stacked:true, beginAtZero:true, grid:{color:'#eef2f4'}}, x:{stacked:true, grid:{display:false}}}}
  }));

  const tipoLabels = Object.keys(tipoCounts);
  charts.push(new Chart(document.getElementById('chartTipo'), {
    type:'doughnut',
    data:{labels:tipoLabels, datasets:[{
      data:tipoLabels.map(k=>tipoCounts[k]), backgroundColor:tipoLabels.map(k=>tipoColors[k].base), borderColor:'#fff', borderWidth:4
    }]},
    options:{cutout:'70%', plugins:{legend:{display:false}}}
  }));
}

/* ============ FILE UPLOAD ============ */
document.getElementById('fileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const statusBar = document.getElementById('statusBar');
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const wb = XLSX.read(evt.target.result, {type:'array'});
      const parsed = parseWorkbook(wb);
      parsed.sourceLabel = file.name;
      if(!parsed.mensual.length && !parsed.proyectos.length){
        throw new Error('No se encontraron hojas "Mensual" o "Proyectos" reconocibles.');
      }
      STATE.data = parsed;
      renderAll();
      statusBar.className = 'ok';
      statusBar.textContent = `✓ Dashboard actualizado con "${file.name}" — ${parsed.proyectos.length} proyectos, ${parsed.mensual.length} meses.`;
    }catch(err){
      statusBar.className = 'err';
      statusBar.textContent = `✕ No se pudo procesar el archivo: ${err.message} Verifica que conserve las hojas "Mensual", "Proyectos" y "Ahorro" con encabezados similares.`;
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});

renderAll();
</script>
</body>
</html>
